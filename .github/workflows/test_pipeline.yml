name: E2E Automation Pipeline (Playwright + Pytest)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run Pytest Tests
        run: |
          python -m pytest -n 2 --browser ${{ matrix.browser }} --alluredir=allure-results || true

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 1

  publish-report:
    name: Generate & Publish Allure Report & Notify Slack
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      # 1. Загружаем код репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Скачиваем артефакты результатов тестов из всех браузеров
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # 3. Автоматически скачиваем историю, генерируем отчет и деплоим на gh-pages
      - name: Generate & Publish Allure Report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      # 4. Отправляем уведомление в Slack
      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_STATUS: ${{ needs.test.result }}
        run: |
          pip install requests
          python utils/slack_notifier.py